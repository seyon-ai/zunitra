<!DOCTYPE html>
<html lang="en">
<head>

<style>
/* Shop-specific styles */
.shop-hero {
  height: 280px; position: relative;
  display: flex; align-items: flex-end;
  padding: 0 48px 48px;
  background: linear-gradient(160deg, #0D0D0D 0%, #080808 100%);
  overflow: hidden;
  margin-top: var(--nav-h);
}
.shop-hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 80% 50%, rgba(201,168,76,0.08), transparent 60%);
}
.shop-hero-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
  background-size: 64px 64px;
}
.shop-hero-content { position: relative; z-index: 2; }
.shop-hero h1 {
  font-family: var(--font-display);
  font-size: clamp(48px, 6vw, 80px);
  font-weight: 300; letter-spacing: -2px;
  line-height: 1;
}
.shop-hero p {
  font-size: 12px; letter-spacing: 3px; color: var(--gray);
  text-transform: uppercase; margin-top: 8px;
}

/* Toolbar */
.shop-toolbar {
  background: var(--dark);
  border-bottom: 1px solid rgba(201,168,76,0.08);
  padding: 16px 48px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  position: sticky; top: var(--nav-h); z-index: 50;
}

.filter-pill {
  padding: 8px 18px;
  background: none;
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--gray);
  font-family: var(--font-body);
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  cursor: none; transition: all var(--transition);
}
.filter-pill:hover { border-color: var(--gold-dark); color: var(--white); }
.filter-pill.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.08); }

.toolbar-search {
  flex: 1; display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 8px 16px;
  transition: border-color var(--transition);
  min-width: 200px; max-width: 320px;
}
.toolbar-search:focus-within { border-color: rgba(201,168,76,0.4); }
.toolbar-search input {
  background: none; border: none; outline: none;
  color: var(--white); font-family: var(--font-body);
  font-size: 12px; letter-spacing: 1px; width: 100%;
}
.toolbar-search input::placeholder { color: var(--gray); }
.toolbar-search svg { color: var(--gold-dark); flex-shrink: 0; }

.sort-control {
  margin-left: auto;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--gray-light);
  padding: 8px 14px;
  font-family: var(--font-body); font-size: 10px; letter-spacing: 2px;
  cursor: none; outline: none;
}
.sort-control option { background: var(--dark3); }

.result-count {
  font-size: 10px; letter-spacing: 2px; color: var(--gray);
  white-space: nowrap;
}

/* Grid */
.shop-main { padding: 2px 48px 80px; background: var(--dark); }
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 2px;
}
.grid-col-3 { grid-template-columns: repeat(3, 1fr); }

.product-card {
  background: var(--dark2);
  border: 1px solid rgba(255,255,255,0.04);
  overflow: hidden; cursor: none;
  transition: border-color var(--transition), transform 0.4s ease;
}
.product-card:hover { border-color: rgba(201,168,76,0.3); transform: translateY(-2px); }

.prod-img {
  aspect-ratio: 1; position: relative;
  background: radial-gradient(circle at 50% 38%, #191919, #090909);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.prod-img .badge { position: absolute; top: 16px; left: 16px; z-index: 2; }
.prod-img svg { transition: transform 0.6s ease; filter: drop-shadow(0 12px 24px rgba(0,0,0,0.7)); }
.product-card:hover .prod-img svg { transform: scale(1.07) rotate(3deg); }

.prod-quick-btns {
  position: absolute; bottom: 0; left: 0; right: 0;
  display: flex; gap: 0;
  transform: translateY(100%);
  transition: transform 0.3s ease;
  z-index: 3;
}
.product-card:hover .prod-quick-btns { transform: translateY(0); }
.prod-quick-btn {
  flex: 1; padding: 13px;
  font-family: var(--font-body); font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  border: none; cursor: none; transition: opacity 0.2s;
}
.prod-quick-btn.add { background: var(--gold); color: var(--black); font-weight: 700; }
.prod-quick-btn.view { background: var(--dark3); color: var(--white); border-left: 1px solid rgba(255,255,255,0.1); flex: 0.4; }
.prod-quick-btn:hover { opacity: 0.88; }

.prod-info { padding: 22px 22px 20px; border-top: 1px solid rgba(255,255,255,0.04); }
.prod-brand { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.prod-name { font-family: var(--font-display); font-size: 22px; font-weight: 400; line-height: 1.2; margin-bottom: 4px; }
.prod-ref { font-size: 10px; letter-spacing: 2px; color: var(--gray); margin-bottom: 14px; }
.prod-footer { display: flex; justify-content: space-between; align-items: flex-end; }
.prod-price { font-family: var(--font-display); font-size: 26px; color: var(--gold); line-height: 1; }
.prod-price .was { font-size: 12px; color: var(--gray); text-decoration: line-through; display: block; font-family: var(--font-body); margin-bottom: 2px; }

/* Skeleton */
.card-skeleton {
  background: var(--dark2);
  border: 1px solid rgba(255,255,255,0.04);
}
.card-skeleton .sk-img { aspect-ratio: 1; }
.card-skeleton .sk-text { padding: 20px; }
.card-skeleton .sk-line { height: 12px; margin-bottom: 10px; border-radius: 2px; }
.card-skeleton .sk-line.w60 { width: 60%; }
.card-skeleton .sk-line.w40 { width: 40%; }

/* No results */
.no-results {
  grid-column: 1/-1; text-align: center;
  padding: 100px 24px;
  display: none;
}
.no-results.show { display: block; }
.no-results-icon { font-size: 48px; opacity: 0.15; display: block; margin-bottom: 20px; }
.no-results p { color: var(--gray); font-size: 13px; letter-spacing: 1px; }

@media (max-width: 1024px) {
  .shop-hero, .shop-toolbar, .shop-main { padding-left: 24px; padding-right: 24px; }
  .grid-col-3 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .product-grid { grid-template-columns: 1fr; }
  .toolbar-search { display: none; }
}

.inr-price { font-size: 11px; color: var(--gray); letter-spacing: 1px; display: block; margin-top: 2px; font-family: var(--font-body); }
</style>
</head>

<script type="module">
import { initShared, fetchProducts, watchSVG, watchDisplay, fmtPrice, Cart, showToast } from "./utils.js";
initShared();

let allProducts = [];
let currentFilter = "all";
let currentSort = "";
let searchQ = "";

// Check URL for category preset
const urlCat = new URLSearchParams(window.location.search).get("cat");
if (urlCat) {
  currentFilter = urlCat;
  document.querySelectorAll(".filter-pill").forEach(p => {
    p.classList.toggle("active", p.dataset.cat === urlCat);
  });
}

async function loadProducts() {
  allProducts = await fetchProducts();
  render();
}

function render() {
  let data = [...allProducts];
  if (currentFilter !== "all") data = data.filter(p => p.category === currentFilter);
  if (searchQ) {
    const q = searchQ.toLowerCase();
    data = data.filter(p =>
      p.name.toLowerCase().includes(q) ||
      p.brand.toLowerCase().includes(q) ||
      p.ref.toLowerCase().includes(q)
    );
  }
  if (currentSort === "price-asc") data.sort((a,b) => a.price - b.price);
  else if (currentSort === "price-desc") data.sort((a,b) => b.price - a.price);
  else if (currentSort === "name") data.sort((a,b) => a.name.localeCompare(b.name));
  else if (currentSort === "rating") data.sort((a,b) => (b.rating||0) - (a.rating||0));

  document.getElementById("result-count").textContent = `${data.length} Piece${data.length !== 1 ? "s" : ""}`;

  const grid = document.getElementById("product-grid");
  if (!data.length) {
    grid.innerHTML = `<div class="no-results show"><span class="no-results-icon">⌚</span><p>No timepieces match your search.</p></div>`;
    return;
  }

  grid.innerHTML = data.map(p => `
    <div class="product-card" data-id="${p.id}">
      <div class="prod-img">
        ${p.badge ? `<span class="badge badge-${p.badge}">${p.badge === "limited" ? "Limited" : p.badge === "new" ? "New" : "Sale"}</span>` : ""}
        ${watchDisplay(p, 180)}
        <div class="prod-quick-btns">
          <button class="prod-quick-btn add" onclick="addToCart('${p.id}',event)">Add to Selection</button>
          <button class="prod-quick-btn view" onclick="window.location.href='product.html?id=${p.id}'">View</button>
        </div>
      </div>
      <div class="prod-info" onclick="window.location.href='product.html?id=${p.id}'">
        <div class="prod-brand">${p.brand}</div>
        <div class="prod-name">${p.name}</div>
        <div class="prod-ref">Ref. ${p.ref}</div>
        <div class="prod-footer">
          <div class="prod-price">
            ${p.originalPrice ? `<span class="was" style="font-size:11px;color:#666;text-decoration:line-through;display:block">$${p.originalPrice.toLocaleString()}</span>` : ""}
            $${fmtPrice(p.price)}
          </div>
          <div class="stars">${"★".repeat(p.rating || 4)}${"☆".repeat(5 - (p.rating||4))}</div>
        </div>
      </div>
    </div>
  `).join("");

  // Re-attach cursor hover
  document.querySelectorAll("button, a, .product-card").forEach(el => {
    el.addEventListener("mouseenter", () => document.querySelector(".cursor-ring")?.classList.add("hovering"));
    el.addEventListener("mouseleave", () => document.querySelector(".cursor-ring")?.classList.remove("hovering"));
  });
}

function addToCart(id, e) {
  e.stopPropagation();
  const p = allProducts.find(x => x.id === id);
  if (p) Cart.add(p);
}

window.setFilter = (cat, btn) => {
  currentFilter = cat;
  document.querySelectorAll(".filter-pill").forEach(p => p.classList.toggle("active", p.dataset.cat === cat));
  render();
};
window.setSort = (v) => { currentSort = v; render(); };
window.handleSearch = () => { searchQ = document.getElementById("search-input").value.trim(); render(); };
window.addToCart = addToCart;

loadProducts();
</script>
